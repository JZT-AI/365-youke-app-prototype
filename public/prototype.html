        filter:['客户筛选','服务、结算、跟进、收藏与时间条件',['结算状态可多选','条件取交集'],'结算状态默认全部；同组多选满足任一项，跨组与搜索取交集。确定后生效，重置后需确定；返回取消本次修改。'],
        customers:['客户列表 · 结算状态','F01 · 在原客户卡片中补充本轮结算结果',['服务与结算分开','返还失效提示'],'结算标签位于服务状态之后。点击标签打开本轮对应财务详情，点击客户卡片沿用线索详情路径；返回保留客户列表条件与位置。'],
        coinFlow:['有客币明细','F05 · 账户事件摘要与条件查询',['线索直达原轮次','财务详情可追溯'],'列表展示事件、数量、客户、时间及关键结果。点击客户与线索编号直接查看对应轮次；其余区域进入财务详情，返回保留查询条件和位置。'],
        flowDetail:['有客币详情','F06 · 单笔事件的原因、构成与关联信息',['结算结果可追溯','查看对应轮次线索'],'详情解释预扣、实扣、返还、免扣、赠送和到期结果；返还区分原数量、恢复可用与失效，线索入口进入本笔所属轮次。'],
        rechargeRecords:['充值记录','F03 · 到账总量优先，实际支付金额次要展示',['已到账 / 处理中','币种拆分'],'处理中使用预计到账，不推断已支付，不提供重复支付按钮。'],
        rechargeDetail:['充值详情','F04 · 到账构成、实际有效期与订单信息',['付费无有效期','到账状态刷新'],'展示当前订单的支付和到账结果；本页不展示该充值订单下的线索消耗。'],
      });
      const coinGroup=groups.find(g=>g.name==='有客币');
      if(coinGroup)coinGroup.items=[['wallet','有客币首页'],['rechargeRecords','充值记录'],['rechargeDetail','充值详情'],['coinFlow','有客币明细'],['flowDetail','有客币详情'],['coinGuide','使用说明']];
      collapsedGroups.clear();
      const finBrand=document.querySelector('.brand p');if(finBrand)finBrand.textContent='全量交互原型';
      document.title='365有客APPV2.0';
      const baseGo=go;
      go=function(id,push=true){
        if(id==='waiverRecords'){finType='free';id='coinFlow'}
        if(id==='filter'&&current!=='filter')finCustomerDraft=copyCustomerFilters(finCustomerFilters);
        const reset=finResetPosition;finResetPosition=false;
        if(finPages.has(current))finScroll.set(`${selectedCity}:${current}`,screenEl.scrollTop);
        baseGo(id,push);screenEl.classList.toggle('fin-scope',finPages.has(id));
        if(reset)finScroll.set(`${selectedCity}:${id}`,0);
        if(finPages.has(id))screenEl.scrollTop=finScroll.get(`${selectedCity}:${id}`)||0;
      };
      const oldBack=back;back=function(){if(sheet.querySelector('#finExpiryTitle')){closeSheet();screenEl.querySelector('[data-fin-expiry]')?.focus();return}if(historyStack.length)oldBack();else go('wallet',false)};
      function resetFilters(){finCustomerFilters=defaultCustomerFilters();finCustomerDraft=copyCustomerFilters(finCustomerFilters);finCustomerQuery='';finCustomerQuick='all';finFavoriteState.clear();finType='all';finCurrentOnly=false;finOrderType='all';finQuery='';finDates={from:'',to:''};finOrderDates={from:'',to:''};finScroll.clear()}
      function refresh(){if(finBusy)return;finBusy=true;const operation=++finOperation,origin=current,city=selectedCity;go(current,false);setTimeout(()=>{if(operation!==finOperation||city!==selectedCity){finBusy=false;return}finBusy=false;if(finMode==='refreshError')finRefreshNotice='刷新失败，以下为上次成功加载的内容。';else{finMode='normal';finRefreshNotice=''}if(current===origin){go(origin,false);showToast(finMode==='refreshError'?'查询失败，请重试':origin==='rechargeDetail'&&orderNow(orders.find(o=>o.id===finOrderId)||orders[1]).pending?'仍在确认中，请稍后刷新':'已刷新')}},550)}
      function showRecord(id){
        const r=allRecords().find(r=>r.id===id);if(!r){showToast('记录暂不可查看');return}
        finResetPosition=true;finMode='normal';finRefreshNotice='';
        if(r.order){finOrderId=r.order;go('rechargeDetail')}else{finRecordId=id;go('flowDetail')}
      }
      window.addEventListener('click',e=>{
        const target=e.target.closest('[data-fin-back],[data-fin-nav],[data-fin-type],[data-fin-record],[data-fin-order],[data-fin-order-filter],[data-fin-current-holds],[data-fin-all-records],[data-fin-expiry],[data-fin-close],[data-fin-date],[data-fin-date-preset],[data-fin-date-apply],[data-fin-date-reset],[data-fin-refresh],[data-fin-retry],[data-fin-clear],[data-fin-search-clear],[data-fin-copy],[data-fin-view-lead],[data-fin-purchase]');
        if(!target)return;e.preventDefault();e.stopImmediatePropagation();
        if(target.hasAttribute('data-fin-back')){back();return}
        if(target.hasAttribute('data-fin-nav')){go(target.dataset.finNav);return}
        if(target.hasAttribute('data-fin-type')){finType=target.dataset.finType;finCurrentOnly=false;finResetPosition=true;go('coinFlow',false);return}
        if(target.hasAttribute('data-fin-record')){showRecord(target.dataset.finRecord);return}
        if(target.hasAttribute('data-fin-order')){finOrderId=target.dataset.finOrder;finResetPosition=true;go('rechargeDetail');return}
        if(target.hasAttribute('data-fin-order-filter')){finOrderType=target.dataset.finOrderFilter;finResetPosition=true;go('rechargeRecords',false);return}
        if(target.hasAttribute('data-fin-current-holds')){finType='hold';finCurrentOnly=true;finQuery='';finDates={from:'',to:''};finResetPosition=true;go('coinFlow');return}
        if(target.hasAttribute('data-fin-all-records')){finType='all';finCurrentOnly=false;finQuery='';finDates={from:'',to:''};finResetPosition=true;go('coinFlow');return}
        if(target.hasAttribute('data-fin-expiry')){openExpiry();return}
        if(target.hasAttribute('data-fin-close')){const wasExpiry=!!sheet.querySelector('#finExpiryTitle');closeSheet();if(wasExpiry&&finSheetOrigin===current)screenEl.querySelector('[data-fin-expiry]')?.focus();return}
        if(target.hasAttribute('data-fin-date')){dateSheet(target.dataset.finDate);return}
        if(target.hasAttribute('data-fin-date-preset')){const key=target.dataset.finDatePreset;document.getElementById('finDateFrom').value=key==='all'?'':key==='month'?'2026-10-01':'2026-07-14';document.getElementById('finDateTo').value=key==='all'?'':'2026-10-14';document.getElementById('finDateError').textContent='';return}
        if(target.hasAttribute('data-fin-date-reset')){document.getElementById('finDateFrom').value='';document.getElementById('finDateTo').value='';document.getElementById('finDateError').textContent='';return}
        if(target.hasAttribute('data-fin-date-apply')){const from=document.getElementById('finDateFrom').value,to=document.getElementById('finDateTo').value;if(from&&to&&from>to){document.getElementById('finDateError').textContent='结束日期不能早于开始日期';return}if(target.dataset.finDateApply==='orders')finOrderDates={from,to};else finDates={from,to};finResetPosition=true;go(current,false);return}
        if(target.hasAttribute('data-fin-clear')){if(current==='rechargeRecords'){finOrderType='all';finOrderDates={from:'',to:''}}else{finType='all';finCurrentOnly=false;finQuery='';finDates={from:'',to:''}}if(finMode==='empty')showToast('当前账户暂无记录');go(current,false);return}
        if(target.hasAttribute('data-fin-search-clear')){finQuery='';go('coinFlow',false);return}
        if(target.hasAttribute('data-fin-refresh')){refresh();return}
        if(target.hasAttribute('data-fin-retry')){finMode='normal';finRefreshNotice='';refresh();return}
        if(target.hasAttribute('data-fin-copy')){const value=target.dataset.finCopy;const area=document.createElement('textarea');area.value=value;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();let ok=false;try{ok=document.execCommand('copy')}catch{}area.remove();showToast(ok?`${target.getAttribute('aria-label')?.replace(/^复制/,'')||'编号'}已复制`:'复制失败，请长按编号复制');return}
        if(target.hasAttribute('data-fin-view-lead')){const lead=leads[target.dataset.finViewLead];if(!lead){showToast('该线索暂不可查看');return}activeCustomer=lead.key;go(lead.route);return}
        if(target.hasAttribute('data-fin-purchase')){showToast('暂时无法打开充值服务，请稍后重试');return}
      },true);
      window.addEventListener('click',e=>{
        const choice=e.target.closest('[data-fin-customer-choice]'),apply=e.target.closest('[data-fin-customer-apply]'),reset=e.target.closest('[data-fin-customer-reset]'),clear=e.target.closest('[data-fin-customer-clear]'),quick=e.target.closest('[data-fin-customer-quick]'),favorite=current==='customers'?e.target.closest('[data-favorite]'):null;
        if(!choice&&!apply&&!reset&&!clear&&!quick&&!favorite)return;
        if(selectedCity!=='xian')return;e.preventDefault();e.stopImmediatePropagation();
        if(choice){const key=choice.dataset.finCustomerChoice,value=choice.dataset.finCustomerValue;
          if(key==='assigned'||key==='active')finCustomerDraft[key]=[value];
          else if(value==='全部')finCustomerDraft[key]=[];
          else finCustomerDraft[key]=finCustomerDraft[key].includes(value)?finCustomerDraft[key].filter(v=>v!==value):[...finCustomerDraft[key],value];
          choice.closest('.filter-block').querySelectorAll('[data-fin-customer-choice]').forEach(button=>{const v=button.dataset.finCustomerValue,on=v==='全部'?!finCustomerDraft[key].length:finCustomerDraft[key].includes(v);button.classList.toggle('on',on);button.setAttribute('aria-pressed',String(on));});return;
        }
        if(reset){finCustomerDraft=defaultCustomerFilters();const position=screenEl.scrollTop;screenEl.innerHTML=pages.filter();screenEl.scrollTop=position;showToast('筛选条件已重置');return;}
        if(apply){finCustomerFilters=copyCustomerFilters(finCustomerDraft);finResetPosition=true;if(historyStack.at(-1)==='customers')back();else go('customers');return;}
        if(clear){finCustomerFilters=defaultCustomerFilters();finCustomerDraft=copyCustomerFilters(finCustomerFilters);finCustomerQuery='';finCustomerQuick='all';finResetPosition=true;go('customers',false);return;}
        if(quick){finCustomerQuick=quick.dataset.finCustomerQuick;finResetPosition=true;go('customers',false);return;}
        if(favorite){const id=favorite.closest('[data-fin-customer-lead]')?.dataset.finCustomerLead;if(!id)return;const on=!favorite.classList.contains('on');finFavoriteState.set(id,on);favorite.classList.toggle('on',on);favorite.setAttribute('aria-label',on?'取消收藏':'收藏客户');showToast(on?'已收藏客户':'已取消收藏');}
      },true);
      let customerSearchTimer;
      window.addEventListener('input',e=>{if(!e.target.matches('[data-fin-customer-search]'))return;finCustomerQuery=e.target.value;const cursor=e.target.selectionStart;clearTimeout(customerSearchTimer);customerSearchTimer=setTimeout(()=>{if(current!=='customers')return;finResetPosition=true;go('customers',false);const input=screenEl.querySelector('[data-fin-customer-search]');input?.focus();input?.setSelectionRange(cursor,cursor)},180)},true);
      let searchTimer;
      window.addEventListener('input',e=>{if(!e.target.matches('[data-fin-search]'))return;finQuery=e.target.value;const cursor=e.target.selectionStart;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{if(current!=='coinFlow')return;finResetPosition=true;go('coinFlow',false);const input=screenEl.querySelector('[data-fin-search]');input.focus();input.setSelectionRange(cursor,cursor)},180)},true);
      window.addEventListener('change',e=>{
        if(e.target.matches('[data-fin-current-only]')){finCurrentOnly=e.target.checked;finResetPosition=true;go('coinFlow',false)}
      },true);
      window.addEventListener('keydown',e=>{
        const dialog=sheet.querySelector('.fin-bottom-sheet');if(!dialog)return;
        if(e.key==='Escape'){e.preventDefault();closeSheet();return}
        if(e.key==='Tab'){const controls=[...dialog.querySelectorAll('button,input')].filter(x=>!x.disabled);const first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
      },true);
      const baseChoose=chooseCity;chooseCity=function(key){const old=selectedCity;baseChoose(key);if(selectedCity!==old){resetFilters();finMode='normal';finOperation++;finRefreshNotice=''}};
    })();


    buildNav();const initialScreen=new URLSearchParams(location.search).get('screen')||'wallet';go(pages[initialScreen]?initialScreen:'wallet',false);
  </script>
