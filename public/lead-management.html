  function feedbackContent(){return `<div class="feedback-card"><div class="feedback-head"><b>${currentLead().agent||'待分配'}</b><time>2026-08-29 18:42:10</time></div><div class="feedback-fields"><span>是否带访<b class="yes">是</b></span><span>是否加微信<b class="yes">是</b></span><span>是否成交<b class="no">否</b></span></div><div class="feedback-note">备注：已完成首次带访，客户希望继续对比同预算房源。</div></div><div class="feedback-card"><div class="feedback-head"><b>${currentLead().agent||'待分配'}</b><time>2026-08-30 20:06:09</time></div><div class="feedback-fields"><span>是否带访<b class="no">否</b></span><span>是否加微信<b class="yes">是</b></span><span>是否成交<b class="no">否</b></span></div></div><div class="end-line">－ 没有更多了 －</div>`}
  function judgeContent(){return `<div class="judge-record"><div class="judge-record-top"><b>周晓</b><time>2026-08-30 22:06:09</time></div><div class="judge-record-body"><span class="judge-label">继续跟进</span><div class="judge-note"><span>判客备注</span>客户仍有明确购房意向，已约定周末带看，继续跟进带看结果和预算调整情况。</div></div></div><div class="judge-record"><div class="judge-record-top"><b>平台判客</b><time>2026-08-29 18:20:12</time></div><div class="judge-record-body"><span class="judge-label">带看</span><div class="judge-note"><span>判客备注</span>已确认带看时间，等待经纪人提交现场反馈。</div></div></div><div class="end-line">－ 没有更多了 －</div><div class="judge-bar"><button class="judge-btn" data-open-judge>◉　平台判客</button></div>`}
  function leadTabBody(){if(detailTab==='群档案')return groupArchiveContent();if(detailTab==='群详情')return groupInfoContent();if(detailTab==='流转记录')return flowContent();if(detailTab==='反馈记录')return feedbackContent();return judgeContent()}
  function leadDetail(){const lead=currentLead(),wait=lead.status==='wait',receptionLabel=lead.longTerm?'长期有效':`剩余接待 ${lead.remainingDays??3}天`,tabs=mode==='session'?['群档案','群详情','流转记录','反馈记录','判客记录']:['流转记录','反馈记录','判客记录'];if(!detailTab||!tabs.includes(detailTab))detailTab=tabs[0];return `<div class="detail-top"><div class="detail-idline"><span class="lead-id-chip">线索ID：${lead.id}</span><span class="status ${wait?'wait':'live'}">${wait?'待分配':'生效中'}</span>${wait?'':`<span class="status ${lead.longTerm?'long-term':'reception'}">${receptionLabel}</span>`}</div><div class="detail-summary-grid"><div class="detail-field"><span>来源渠道</span><b>${lead.source||'自动生成'}</b></div><div class="detail-field"><span>承接小B</span><b>${wait?'--':lead.agent}</b></div><div class="detail-field"><span>跟进状态</span><b class="tag green">${wait?'待跟进':'已跟进'}</b></div><div class="detail-field"><span>反馈状态</span><b class="tag ${wait?'red':'green'}">${wait?'待标记':'已标记'}</b></div><div class="detail-field"><span>判客状态</span><b class="tag red">未判客</b></div><div class="detail-field"><span>机器判客</span><b class="tag blue">继续跟进</b></div><div class="detail-field wide"><span>群状态</span><b>正常</b></div></div>${mode==='session'?`<div class="house-info"><h3>用户需求</h3><div class="house-grid"><span>意向价格</span><b>250-300万</b><span>意向面积</span><b>100-130㎡</b><span>意向房源</span><b>住宅</b><span>意向户型</span><b>三室/四室</b><span>意向区域</span><b>曲江、高新</b><span>通勤偏好</span><b>地铁优先</b></div></div>`:''}${wait?'<div class="detail-actions"><button class="action-btn" data-assign>分配</button><button class="action-btn" data-invalid>失效</button></div>':''}</div><div class="tabs">${tabs.map(x=>`<button class="tab ${x===detailTab?'active':''}" data-detail-tab="${x}">${x}</button>`).join('')}</div><div class="tab-body">${leadTabBody()}</div>`}
  function renderDetail(){if(detailKind==='lead')$('#detail').innerHTML=leadDetail();else if(detailKind==='group')$('#detail').innerHTML=groupDetail();else $('#detail').innerHTML=profileDetail();bindDetail()}
  function bindDetail(){$$('[data-profile-tab]').forEach(b=>b.onclick=()=>{profileTab=b.dataset.profileTab;renderDetail()});$$('[data-group-tab]').forEach(b=>b.onclick=()=>{detailTab=b.dataset.groupTab;renderDetail()});$$('[data-detail-tab]').forEach(b=>b.onclick=()=>{detailTab=b.dataset.detailTab;renderDetail()});const j=$('[data-open-judge]');if(j)j.onclick=openJudge;const a=$('[data-assign]');if(a)a.onclick=openAssign;const inv=$('[data-invalid]');if(inv)inv.onclick=openInvalid}
  function bindChat(){$$('[data-lead-node]').forEach(n=>n.onclick=e=>{if(e.target.closest('[data-open-group]'))return;toggleLead(n.dataset.leadNode,false)});$$('[data-group-selection]').forEach(n=>n.onclick=()=>toggleLead(n.dataset.groupSelection,false));$$('[data-selection-toggle]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.selectionToggle;collapsedSelections.has(id)?collapsedSelections.delete(id):collapsedSelections.add(id);renderChat()});$$('[data-open-group]').forEach(o=>o.onclick=e=>{e.stopPropagation();openLinkedGroup(o.closest('[data-lead-node]').dataset.leadNode)})}
  function toggleLead(id,scroll){const showingSame=activeLead===id&&detailKind==='lead';if(showingSame){detailKind=mode==='session'?'profile':'group';detailTab=mode==='group'?'群档案':'';renderChat();renderDetail();return}selectLead(id,scroll)}
  function openLinkedGroup(id){conversationPanel='linked-group';linkedLeadId=id;renderHeader();renderChat();toast('已在当前会话中打开关联群聊')}
  function returnToPrivate(){conversationPanel='private';linkedLeadId=null;renderHeader();renderChat()}
  function renderAssignModal(){const item=currentItem(),lead=currentLead(),candidate=assignCandidates[assignCandidate],price=50;$('#assignAvatar').className=`avatar av${item.avatar}`;$('#assignCustomer').textContent=mode==='group'?item.customer:item.name;$('#assignSource').textContent=lead.source||'自动生成';$('#assignPrice').textContent=`${price} 客米`;$('#normalPrice').textContent=`${price} 客米`;const reuse=!!lead.linked;$('#assignGroupTitle').textContent=reuse?'复用旧群':'建新群';$('#assignGroupDesc').textContent=reuse?`复用旧群：${mode==='group'?item.name:`${item.name}｜365选房沟通群`}`:'分配后将创建新的撮合群';$('#selectedCandidateName').textContent=candidate.name;$('#assignDeduction').textContent=settlement==='free'?'预计扣除0客米':`预计扣除${price}客米`;$('#candidateList').innerHTML=assignCandidates.map((c,i)=>{const shown=c.plates.slice(0,4),hidden=c.plates.slice(4),more=hidden.length;return `<div class="candidate ${i===assignCandidate?'selected':''}" data-candidate="${i}" role="button" tabindex="0"><div class="candidate-main">${avatarMarkup(c.avatar,true)}<div><div class="candidate-name"><span class="candidate-brand">${c.brand}</span>${c.name}</div><div class="candidate-store">${c.store}</div></div><div class="candidate-finance"><div>客米余额 <b>${c.balance}</b></div><div>近3天已扣 <b class="deduct">${c.recent}</b></div></div></div><div class="candidate-meta"><span>☎ ${c.phone}</span></div><div class="candidate-plates">${shown.map(p=>`<span class="plate">${p}</span>`).join('')}${more>0?`<span class="plate-more-wrap"><button class="plate-more" data-plate-more aria-label="查看全部所属板块">+${more}</button><span class="plate-popover">全部板块：${c.plates.join('、')}</span></span>`:''}</div></div>`}).join('');$$('[data-candidate]').forEach(b=>{b.onclick=()=>{assignCandidate=+b.dataset.candidate;renderAssignModal()};b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();b.click()}}});$$('[data-plate-more]').forEach(b=>b.onclick=e=>{e.stopPropagation();const wrap=b.closest('.plate-more-wrap'),open=wrap.classList.contains('open');$$('.plate-more-wrap').forEach(x=>x.classList.remove('open'));if(!open)wrap.classList.add('open')});$$('[data-settlement]').forEach(b=>b.classList.toggle('active',b.dataset.settlement===settlement))}
  function openAssign(){assignCandidate=0;settlement='normal';renderAssignModal();$('#assignModal').classList.add('show')}
  function openInvalid(){invalidChoice='';$('#invalidReason').value='';$('#invalidCounter').textContent='0 / 100';$('#invalidError').classList.remove('show');const reasons=['低价','低价&高需求','假房源引流','观望','进群','卖房/租房/出租','骚扰','随意看看','推荐房源不匹配需求','同行','无决策权','需求不明','需求不匹配市场','异地','暂无购房需求','重复线索','需求被板块再承接经纪人'];$('#invalidOptions').innerHTML=reasons.map(x=>`<button class="invalid-option" data-invalid-choice="${x}">${x}</button>`).join('');$$('[data-invalid-choice]').forEach(b=>b.onclick=()=>{invalidChoice=b.dataset.invalidChoice;$$('[data-invalid-choice]').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#invalidError').classList.remove('show')});$('#invalidModal').classList.add('show')}
  function selectLead(id,scroll){activeLead=id;detailKind='lead';detailTab=mode==='session'?'群档案':'流转记录';renderLeadFilter();renderChat();renderDetail();if(scroll)setTimeout(()=>{const node=$(`[data-lead-node="${id}"],[data-group-selection="${id}"]`);if(node)node.scrollIntoView({block:'center',behavior:'smooth'})},50)}
  function resetConversation(){activeLead=currentItem().leads[0].id;detailKind=mode==='session'?'profile':'group';detailTab=mode==='group'?'群档案':'';conversationPanel='private';linkedLeadId=null}
  function openConversation(i){activeIndex=i;if(!openTabs[mode].includes(i))openTabs[mode].push(i);resetConversation();renderAll()}
  function renderAll(){renderCards();renderWorkspaceTabs();renderHeader();renderLeadFilter();renderChat();renderDetail()}
  function setMode(next){mode=next;activeIndex=openTabs[mode][0]||0;resetConversation();$$('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));renderFilter();renderAll()}
  function openJudge(){const opts=['继续跟进','约带看成功/带看','成交','无效或终止'];$('#judgeOptions').innerHTML=opts.map((x,i)=>`<button class="judge-option ${i===0?'active':''}">${x}</button>`).join('');$$('.judge-option').forEach(b=>b.onclick=()=>{$$('.judge-option').forEach(x=>x.classList.remove('active'));b.classList.add('active')});$('#judgeModal').classList.add('show')}
  $$('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$$('.group-item').forEach(b=>b.onclick=()=>{$$('.group-item').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#listTitle').textContent=b.dataset.group;toast(`已切换至${b.dataset.group}`)});$('[data-refresh]').onclick=()=>toast('已刷新当前列表');$('[data-close-judge]').onclick=()=>$('#judgeModal').classList.remove('show');$('[data-save-judge]').onclick=()=>{$('#judgeModal').classList.remove('show');toast('判客记录已保存')};$('.judge-textarea').oninput=e=>$('.counter').textContent=`${e.target.value.length} / 50`;$$('[data-close-assign]').forEach(b=>b.onclick=()=>$('#assignModal').classList.remove('show'));$$('[data-settlement]').forEach(b=>b.onclick=()=>{settlement=b.dataset.settlement;renderAssignModal()});$('[data-confirm-assign]').onclick=()=>{$('#assignModal').classList.remove('show');toast('分配成功，线索已进入分配中')};$$('[data-close-invalid]').forEach(b=>b.onclick=()=>$('#invalidModal').classList.remove('show'));$('#invalidReason').oninput=e=>$('#invalidCounter').textContent=`${e.target.value.length} / 100`;$('[data-confirm-invalid]').onclick=()=>{if(!invalidChoice&&!$('#invalidReason').value.trim())return $('#invalidError').classList.add('show');$('#invalidModal').classList.remove('show');toast('线索已失效')};$$('.modal-wrap').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('show')});
  resetConversation();renderFilter();renderAll();
</script>
